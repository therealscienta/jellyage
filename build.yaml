targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Converts media age ratings between rating systems (MPAA, BBFC, FSK, and more) using a user-defined mapping table."
description: >
  Automatically converts OfficialRating values on library items between different age rating
  systems such as MPAA, BBFC, FSK, and custom systems. Runs after every library scan.
  Includes a dashboard page for managing the mapping table, listing unrated items,
  and browsing all items grouped by their current rating.
category: "Metadata"
owner: "jellyfin"
artifacts:
- "Jellyfin.Plugin.AgeRating.dll"
changelog: >
  Behaviour change: automation now only fills in ratings that are empty and never
  overwrites one you set yourself. The "Overwrite existing ratings" setting is gone,
  replaced by an explicit, confirmed "Re-map all" action for re-applying the mapping
  table after changing target system. Previously that setting, when on, silently
  reverted hand-edited ratings on the next run.
  Also: filter the item list by library; an "Unmapped in library" worklist on the
  settings page that turns a rating with no mapping row into a pre-filled row in one
  click, with a matching "No mapping match" filter chip; mapping rows sorted by target
  rating and manually-added rows marked; and "Run Now" no longer does nothing when
  "Run after library scan" is unchecked.
